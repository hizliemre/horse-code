name: Release

# A tag is the trigger, so publishing is a deliberate act with a name: `git tag v0.1.0 && git push --tags`.
# Publishing on every push to main would make the version field the only thing standing between a typo and
# a release nobody can unpublish — npm keeps a published version forever.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20     # the same guard as CI: a hang must cost minutes, not hours
    environment: npm            # a protection rule here can require an approval before the token is reachable
    permissions:
      contents: write           # create the GitHub Release
      id-token: write           # provenance: signs the package with a statement of where it was built
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the suite diffs this repository against HEAD~1 — see ci.yml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The tag and the manifest must agree BEFORE anything is built or sent.
      #
      # `git tag v0.2.0` on a tree whose package.json still says 0.1.0 republishes 0.1.0 — which npm refuses
      # if it exists, and silently mislabels if it does not. The tag is what a human reads; the manifest is
      # what npm records. They disagreeing is the whole failure, so it is the first thing checked.
      - name: Tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG — bump one of them and re-tag"
            exit 1
          fi
          echo "publishing $PKG"

      # The same gate CI runs. Re-run rather than trust a green tick on some earlier commit: what is being
      # published is THIS tree, and it is the last moment anything can be stopped.
      #
      # `prepublishOnly` runs all three again inside `npm publish`, and that duplication is deliberate: it is
      # what protects a publish done by hand from a laptop, where no workflow is watching. Here the value is
      # attribution — a failure reports as "npm test", not buried in the output of `npm publish`, which is
      # exactly how the first attempt at v0.1.0 presented itself.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Refuse a version that is already on the registry with a message that says so, instead of letting
      # `npm publish` fail with E403 halfway through.
      # The NAME comes from the manifest too. It was written out here, and when the package was renamed —
      # npm refuses a name too similar to one that exists — this check would have gone on asking the
      # registry about a package nobody was publishing, and answered "not published" every time.
      - name: Version is not already published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          PKG="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$PKG" version >/dev/null 2>&1; then
            echo "::error::$NAME@$PKG is already on the registry — npm versions are permanent, bump first"
            exit 1
          fi

      # npm answers "403 Forbidden" to two different questions and does not say which one it is answering:
      # a token that cannot authenticate at all, and a token that authenticates but is not permitted to
      # publish. Two release attempts were spent on that ambiguity. `whoami` settles the first, so whatever
      # the next failure is, it is a different failure.
      - name: Token authenticates
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! who="$(npm whoami 2>&1)"; then
            echo "::error::NPM_TOKEN does not authenticate — it is expired, revoked, or not an npm token: $who"
            exit 1
          fi
          echo "authenticated as $who — a 403 after this line is about what this token MAY DO, not who it is."
          echo "Publishing needs a Granular Access Token (Read and write, covering a package that does not"
          echo "exist yet — so 'All packages') or a classic AUTOMATION token. A classic 'Publish' token is"
          echo "refused when the account has 2FA on writes, which is what E403 reports."

      # --provenance publishes a signed attestation of the commit and workflow that produced the tarball, so
      # anyone installing can verify it came from this repository rather than from someone's laptop.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
